name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: npm install

      - name: Build APK (preview profile)
        run: eas build --platform android --profile preview --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Get APK download URL from EAS
        id: get_apk
        run: |
          APK_URL=$(eas build:list --platform android --status finished --limit 1 --json --non-interactive | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8'); const b=JSON.parse(d); console.log(b[0].artifacts.buildUrl);")
          echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK from EAS
        run: |
          curl -L "${{ steps.get_apk.outputs.apk_url }}" -o codingkida-latest.apk

      - name: Get version from app.json
        id: get_version
        run: |
          VERSION=$(node -e "console.log(require('./app.json').expo.version)")
          BUILD_NUM=$(date +%Y%m%d%H%M)
          echo "version=v$VERSION-build$BUILD_NUM" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: CodingKida ${{ steps.get_version.outputs.version }}
          body: |
            ## CodingKida Android App
            
            **Build:** ${{ steps.get_version.outputs.version }}
            **Commit:** ${{ github.sha }}
            
            ### Install
            1. Download `codingkida-latest.apk` below
            2. Enable "Install from unknown sources" on your Android device
            3. Install the APK
          files: codingkida-latest.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
